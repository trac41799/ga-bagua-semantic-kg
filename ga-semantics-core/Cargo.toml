[package]
name = "ga-semantics-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.78.0"
license = "MIT OR Apache-2.0"
description = "Geometric Algebra semantic layer with Bagua taxonomy for knowledge graphs"
keywords = ["geometric-algebra", "clifford-algebra", "knowledge-graph", "bagua", "semantics"]
categories = ["science", "data-structures", "algorithms"]
repository = "https://github.com/trac41799/ga-bagua-semantic-kg"
readme = "../README.md"

[features]
default = ["serde"]
serde = ["dep:serde"]
store = ["serde", "dep:serde_json"]
python = ["dep:pyo3"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }

[dev-dependencies]
serde_json = "1"
