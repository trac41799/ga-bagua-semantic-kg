[package]
name = "ga-semantics-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for ga-semantics — interactive and batch semantic operations"

[[bin]]
name = "ga-semantics"
path = "src/main.rs"

[dependencies]
ga-semantics-core = { path = "../ga-semantics-core" }
clap = { version = "4", features = ["derive", "std", "help", "usage", "error-context"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
