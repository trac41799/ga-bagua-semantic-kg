name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-14
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install cross-compilation deps (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release -p ga-semantics-mcp --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/ga-semantics-mcp.exe" "ga-semantics-mcp-${{ matrix.target }}.exe"
          Copy-Item "docs/skills/bagua-encoder/SKILL.md" "bagua-encoder-skill.md"
          Compress-Archive -Path "ga-semantics-mcp-${{ matrix.target }}.exe","bagua-encoder-skill.md" -DestinationPath "ga-semantics-mcp-${{ matrix.target }}.zip"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/ga-semantics-mcp ga-semantics-mcp-${{ matrix.target }}
          cp docs/skills/bagua-encoder/SKILL.md bagua-encoder-skill.md
          tar -czf ga-semantics-mcp-${{ matrix.target }}.tar.gz ga-semantics-mcp-${{ matrix.target }} bagua-encoder-skill.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: ga-semantics-mcp-${{ matrix.target }}.*

  npm-publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: binaries
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Prepare npm package
        run: |
          mkdir -p npm-package/binaries
          cp binaries/*.tar.gz npm-package/binaries/ 2>/dev/null || true
          cp binaries/*.zip npm-package/binaries/ 2>/dev/null || true
          cp npm/package.json npm-package/
          cp npm/install.js npm-package/
          cp npm/README.md npm-package/

      - name: Publish to npm
        run: cd npm-package && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
