[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yarrow-factorial"
version = "0.1.0"
description = "Exact 2^k factorial design math on the blade algebra of Cl(3): interaction spectrum + Bagua naming layer (naming only, no semantics)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.scripts]
yarrow = "yarrow.report:cli"

[tool.setuptools]
packages = ["yarrow"]
